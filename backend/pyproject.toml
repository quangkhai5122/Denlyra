[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denlyra-foundation"
version = "0.1.0"
description = "Synthetic-data-only Denlyra domain research starter; NOT EMR software"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3", "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "alembic>=1.14,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 108
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
