name: denlyra-research-demo-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-demo-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic demo dependencies
        run: python -m pip install -c backend/constraints-baseline.txt -e './backend[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test no-PHI demo domain
        run: python -m pytest backend/tests -q
      - name: Smoke-check CLI and disposable SQLite migration
        run: python scripts/smoke_baseline.py
      - name: Run isolated encrypted DR restore drill
        run: python scripts/run_dr_restore_drill.py
      - name: Run offline AI safety and prompt-injection benchmark
        run: python scripts/run_ai_eval_harness.py
      - name: Verify generated OpenAPI TypeScript client
        run: python scripts/generate_openapi_ts.py --check
      - name: Syntax-check backend
        run: python -m compileall -q backend/src
      - name: Syntax-check demo browser code
        run: node --check apps/demo-web/app.js
      - name: Lint Python
        run: python -m ruff check backend/src backend/tests
      - name: Lint baseline utilities
        run: python -m ruff check --config backend/pyproject.toml scripts/smoke_baseline.py scripts/update_manifest.py scripts/verify_artifact.py scripts/verify_postgres_live.py scripts/run_dr_restore_drill.py scripts/run_ai_eval_harness.py scripts/generate_openapi_ts.py
      - name: Verify capability safety labels
        run: python scripts/verify_artifact.py
      - name: Verify source manifest
        run: python scripts/update_manifest.py --check

  postgres-concurrency-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: denlyra_demo
          POSTGRES_PASSWORD: DEMO_ONLY_CHANGE_ME
          POSTGRES_DB: denlyra_demo
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U denlyra_demo -d denlyra_demo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      DENLYRA_TEST_POSTGRES_URL: postgresql+psycopg://denlyra_demo:DEMO_ONLY_CHANGE_ME@127.0.0.1:5433/denlyra_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and PostgreSQL driver
        run: python -m pip install -e './backend[dev,postgres]'
      - name: Verify PostgreSQL exclusion constraint and barrier concurrency race
        run: python scripts/verify_postgres_live.py
      - name: Run pytest concurrency suite against PostgreSQL
        run: python -m pytest backend/tests/test_scheduling_concurrency.py -q

  next-prototype-build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: apps/clinic-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/clinic-web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate
